[project]
name = "tabular-data-validator"
version = "0.1.1"
description = "A Python library for validating tabular datasets using configurable validation rules"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Emilia Masiak", email = "90275335+Emka5885@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1.4",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
tabular-data-validator = "tabular_data_validator.cli:main"